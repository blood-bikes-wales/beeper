name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache node_modules
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

  terraform-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -diff -recursive infrastructure

  unit-tests:
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache node_modules
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

  integration-tests:
    runs-on: ubuntu-latest
    needs: [lint, terraform-lint]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: google-github-actions/setup-gcloud@v2

      - name: Install Datastore emulator
        run: gcloud components install beta cloud-datastore-emulator --quiet

      - name: Cache node_modules
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Start Datastore emulator
        run: |
          gcloud beta emulators datastore start --quiet \
            --project=beeper-local \
            --host-port=localhost:8081 &
          until curl -sf http://localhost:8081; do sleep 1; done

      - name: Integration tests
        run: npm run test:integration
        env:
          THREE_RINGS_API_KEY: test-api-key
          TWILIO_ACCOUNT_SID: sm-account-sid
          TWILIO_AUTH_TOKEN: sm-auth-token
          DATASTORE_EMULATOR_HOST: localhost:8081
          DATASTORE_PROJECT_ID: beeper-local
