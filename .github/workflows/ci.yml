name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Integration tests
        run: npm run test:integration
        env:
          THREE_RINGS_API_KEY: test-api-key
          TWILIO_ACCOUNT_SID: sm-account-sid
          TWILIO_AUTH_TOKEN: sm-auth-token
